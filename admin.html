<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shop Manager | House of Al Mahrah</title>
<style>
:root{--wine:#4A1220;--burg:#6E1F32;--gold:#B08D4A;--sand:#EADFCB;--ivory:#FBF7EF;--ink:#2A1A1D;--ok:#2f7a4d;--bad:#b3261e;--line:#e3d6bd}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--wine);color:var(--sand);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.04em;flex:1;min-width:200px}
.top small{display:block;font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.btn{border:1px solid var(--burg);background:#fff;color:var(--burg);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sand)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}.btn.pri:hover{background:#9c7a3d}
.btn.dark{background:transparent;color:var(--sand);border-color:rgba(234,223,203,.5)}.btn.dark:hover{background:rgba(255,255,255,.12)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.banner{background:#fff6dc;border-bottom:1px solid #ecd9a0;padding:10px 20px;font-size:14px}
.banner b{color:var(--wine)}
.tabs{display:flex;gap:4px;padding:14px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto;background:#fff}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500;color:#6a5558;white-space:nowrap}
.tabs button.on{color:var(--wine);border-color:var(--gold)}
main{max-width:1150px;margin:0 auto;padding:20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar input,.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.bar input{flex:1;min-width:180px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.card.hid{opacity:.6}
.ch{display:flex;gap:14px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.ch img{width:52px;height:72px;object-fit:cover;border-radius:6px;background:var(--sand);flex:none}
.ch .nm{flex:1;min-width:160px}.ch .nm b{display:block;font-size:16px;color:var(--wine)}.ch .nm span{font-size:13px;color:#6a5558}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:#e5f3ea;color:var(--ok)}
.pill.low{background:#fff0d6;color:#9a6200}.pill.out{background:#fde4e2;color:var(--bad)}.pill.mto{background:#e3eef2;color:#1E4A57}.pill.hid{background:#eee;color:#555}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.body{border-top:1px solid var(--line);padding:16px 18px;background:#fffdf8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#6a5558}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:400;text-transform:none;letter-spacing:0;font-size:15px}
label.f textarea{min-height:96px;resize:vertical}
label.f small{font-weight:400;text-transform:none;letter-spacing:0;color:#8d7a7c}
h3{font-size:15px;color:var(--wine);margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
h3:first-child{margin-top:0}
.chk{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}
.chk label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:center;font-size:12px;letter-spacing:.05em;color:#6a5558;padding:6px 4px}
.tbl td{padding:5px 4px;border-top:1px solid #f0e6d2;text-align:center;vertical-align:middle}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl input[type=number]{width:60px;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:center}
.tbl input[type=text]{width:130px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.tbl input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.tbl select{padding:6px;border:1px solid var(--line);border-radius:6px;max-width:150px}
.tbl input.zero{background:#fde4e2;border-color:#f3b7b2}
.scroll{overflow-x:auto}
.ph{display:flex;gap:10px;align-items:center;margin:6px 0}
.ph img{width:40px;height:56px;object-fit:cover;border-radius:5px;background:var(--sand)}
.ph input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:6px}
.prev{margin-top:8px;padding:8px 12px;background:#eef6f0;border-radius:8px;font-size:14px}
.note{font-size:13px;color:#6a5558;margin:6px 0}
.sgroup{margin-bottom:12px}
.sgroup .sh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sgroup .sh b{font-size:16px;color:var(--wine)}
.help{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 22px 18px}
.help h2{font-size:18px;color:var(--wine);margin:20px 0 6px}.help li{margin:4px 0}
code{background:#f3ead6;padding:1px 6px;border-radius:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--wine);color:#fff;padding:10px 20px;border-radius:30px;opacity:0;transition:.4s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media(max-width:600px){.top{padding:10px 12px}.ch img{width:44px;height:60px}}
</style>
</head>
<body>
<div class="top">
  <h1>Shop Manager <small>House of Al Mahrah</small></h1>
  <a class="btn dark" href="index.html" target="_blank">Open website</a>
  <button class="btn dark" data-act="discard">Discard changes</button>
  <button class="btn pri" data-act="download">Download products.js</button>
</div>
<div class="banner" id="banner"></div>
<div class="tabs" id="tabs"></div>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script src="data/products.js"></script>
<script>
(function () {
  var KEY = "am_admin_draft_v1";
  var STD = ["XS", "S", "M", "L", "XL", "XXL"];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var S, UI = { tab: "stock", open: {}, q: "", filter: "all" }, usedDraft = false, dirty = false;

  /* ---------- load + normalise ---------- */
  function normProduct(p) {
    p = clone(p);
    if (!p.images || !p.images.length) p.images = p.image ? [p.image] : [];
    delete p.image;
    if (p.oldPrice && p.oldPrice > p.price) { p.salePrice = p.price; p.price = p.oldPrice; }
    delete p.oldPrice;
    p.colours = (p.colours || []).map(function (c) {
      c = clone(c);
      if (!c.sizes) c.sizes = clone(p.sizes || {});
      return c;
    });
    delete p.sizes;
    ["description", "badge", "fabric", "fit", "includes", "care", "arabic", "category"].forEach(function (k) { if (p[k] == null) p[k] = ""; });
    p.longDescription = p.longDescription || []; p.highlights = p.highlights || [];
    p.madeToOrder = !!p.madeToOrder; p.outOfStock = !!p.outOfStock; p.hidden = !!p.hidden; p.crop = !!p.crop;
    return p;
  }
  function fresh() { return { store: clone(STORE), cats: clone(CATEGORIES), prods: PRODUCTS.map(normProduct) }; }
  function init() {
    S = fresh();
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || "null");
      if (d && d.prods) { S = d; usedDraft = true; dirty = true; }
    } catch (e) {}
  }
  var saveT;
  function save() { dirty = true; clearTimeout(saveT); saveT = setTimeout(function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} banner(); }, 250); }
  function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("show"); }, 2400); }

  /* ---------- helpers ---------- */
  function sizesOf(p) {
    var seen = {}; p.colours.forEach(function (c) { Object.keys(c.sizes || {}).forEach(function (s) { seen[s] = 1; }); });
    var all = Object.keys(seen);
    return all.sort(function (a, b) { var x = STD.indexOf(a), y = STD.indexOf(b); if (x < 0) x = 99; if (y < 0) y = 99; return x - y || (a < b ? -1 : 1); });
  }
  function total(p) { var t = 0; p.colours.forEach(function (c) { for (var s in c.sizes) t += +c.sizes[s] || 0; }); return t; }
  function priceInfo(p) {
    var mrp = +p.price || 0, sale = null, r = function (n) { return Math.round(n / 10) * 10; };
    if (p.salePrice && p.salePrice < mrp) sale = +p.salePrice; else if (p.discount > 0) sale = r(mrp * (100 - p.discount) / 100);
    if (sale == null) return { pay: mrp, off: 0 };
    return { pay: sale, off: Math.round((mrp - sale) / mrp * 100), mrp: mrp };
  }
  function status(p) {
    if (p.hidden) return ["hid", "Hidden"];
    if (p.outOfStock) return ["out", "Out of stock"];
    if (p.madeToOrder) return ["mto", "Made to order"];
    var t = total(p);
    if (t === 0) return ["out", "Sold out"];
    if (t <= (+S.store.lowStockAt || 3)) return ["low", "Few left (" + t + ")"];
    return ["", "In stock (" + t + ")"];
  }
  function fmt(n) { return (S.store.currency || "") + Number(n).toLocaleString("en-IN"); }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "product"; }
  function banner() {
    $("banner").innerHTML = (dirty ? "<b>You have changes that are not on your website yet.</b> " : "") +
      "Edit here, then click <b>Download products.js</b> (top right) and replace <code>data/products.js</code> on your site and upload it. " +
      (usedDraft ? '<br><span style="color:#8a5a00">Showing your saved draft from this browser.</span>' : "");
  }

  /* ---------- views ---------- */
  function visible(p) {
    var q = UI.q.toLowerCase();
    if (q && (p.name + " " + p.id + " " + p.category).toLowerCase().indexOf(q) < 0) return false;
    if (UI.filter === "out") return p.outOfStock || (!p.madeToOrder && total(p) === 0);
    if (UI.filter === "low") return !p.outOfStock && !p.madeToOrder && total(p) > 0 && total(p) <= (+S.store.lowStockAt || 3);
    if (UI.filter === "hidden") return p.hidden;
    return true;
  }
  function toolbar(withAdd) {
    return '<div class="bar"><input id="q" placeholder="Search products" value="' + esc(UI.q) + '">' +
      '<select id="flt">' + [["all", "All products"], ["out", "Out of stock"], ["low", "Few left"], ["hidden", "Hidden"]].map(function (o) { return '<option value="' + o[0] + '"' + (UI.filter === o[0] ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select>" +
      (withAdd ? '<button class="btn pri" data-act="addp">+ Add product</button>' : "") + "</div>";
  }
  function head(p, i, full) {
    var st = status(p), pr = priceInfo(p);
    return '<div class="ch"><img src="' + esc(p.images[0] || "") + '" alt=""><div class="nm"><b>' + esc(p.name || "Untitled") + '</b><span>' + esc(catName(p.category)) + " &middot; " + fmt(pr.pay) + (pr.off ? " (" + pr.off + "% off)" : "") + '</span></div>' +
      '<span class="pill ' + st[0] + '" id="pill' + i + '">' + st[1] + "</span>" +
      '<div class="acts">' +
      '<button class="btn sm ' + (p.outOfStock ? "on" : "") + '" data-act="oos" data-i="' + i + '">' + (p.outOfStock ? "Mark back in stock" : "Mark out of stock") + "</button>" +
      (full ? '<button class="btn sm" data-act="hide" data-i="' + i + '">' + (p.hidden ? "Show on website" : "Hide") + '</button><button class="btn sm" data-act="up" data-i="' + i + '">&uarr;</button><button class="btn sm" data-act="down" data-i="' + i + '">&darr;</button><button class="btn sm pri" data-act="open" data-i="' + i + '">' + (UI.open[p.id] ? "Close" : "Edit") + "</button>" : "") +
      "</div></div>";
  }
  function catName(id) { var c = S.cats.filter(function (x) { return x.id === id; })[0]; return c ? c.name : id; }

  function stockView() {
    var h = toolbar(false) + '<p class="note">Type how many pieces you have in each size. <b>0 means out of stock</b> for that size. Red boxes are at 0. Changes save automatically as a draft.</p>';
    S.prods.forEach(function (p, i) {
      if (!visible(p)) return;
      var sz = sizesOf(p);
      h += '<div class="card' + (p.hidden ? " hid" : "") + '">' + head(p, i, false) + '<div class="body"><div class="scroll"><table class="tbl"><tr><th>Colour</th>' + sz.map(function (s) { return "<th>" + esc(s) + "</th>"; }).join("") + "<th></th></tr>" +
        p.colours.map(function (c, ci) {
          return "<tr><td>" + esc(c.name) + "</td>" + sz.map(function (s) {
            var v = c.sizes[s] == null ? "" : c.sizes[s];
            return '<td><input type="number" min="0" data-a="st" data-i="' + i + '" data-c="' + ci + '" data-s="' + esc(s) + '" value="' + v + '"' + (v === 0 && !p.madeToOrder ? ' class="zero"' : "") + "></td>";
          }).join("") + '<td><button class="btn sm danger" data-act="c0" data-i="' + i + '" data-c="' + ci + '">Sold out</button></td></tr>';
        }).join("") + "</table></div>" + (p.madeToOrder ? '<p class="note">This is a made-to-order piece, so stock numbers are ignored on the website.</p>' : "") + "</div></div>";
    });
    return h;
  }

  function productsView() {
    var h = toolbar(true);
    S.prods.forEach(function (p, i) {
      if (!visible(p)) return;
      h += '<div class="card' + (p.hidden ? " hid" : "") + '">' + head(p, i, true) + (UI.open[p.id] ? editor(p, i) : "") + "</div>";
    });
    return h || '<p class="note">No products.</p>';
  }

  function fld(i, k, label, v, opt) {
    opt = opt || {};
    if (opt.area) return '<label class="f">' + label + (opt.hint ? " <small>" + opt.hint + "</small>" : "") + '<textarea data-a="f" data-i="' + i + '" data-k="' + k + '" data-t="lines">' + esc(v) + "</textarea></label>";
    return '<label class="f">' + label + (opt.hint ? " <small>" + opt.hint + "</small>" : "") + '<input ' + (opt.num ? 'type="number" min="0"' : 'type="text"') + ' data-a="f" data-i="' + i + '" data-k="' + k + '" data-t="' + (opt.num ? "num" : "str") + '" value="' + esc(v) + '"></label>';
  }
  function editor(p, i) {
    var pr = priceInfo(p), mode = p.discount > 0 ? "pct" : p.salePrice ? "sale" : "none";
    var sz = sizesOf(p), ph = p.images;
    var h = '<div class="body"><h3>Basics</h3><div class="grid">' + fld(i, "name", "Name", p.name) + fld(i, "arabic", "Arabic name", p.arabic) +
      '<label class="f">Category<select data-a="f" data-i="' + i + '" data-k="category" data-t="str">' + S.cats.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === p.category ? " selected" : "") + ">" + esc(c.name) + "</option>"; }).join("") + "</select></label>" +
      fld(i, "badge", "Badge", p.badge, { hint: "New, Bestseller, or leave empty" }) + "</div>" +
      '<div class="chk"><label><input type="checkbox" data-a="f" data-t="bool" data-i="' + i + '" data-k="outOfStock"' + (p.outOfStock ? " checked" : "") + "> Out of stock</label>" +
      '<label><input type="checkbox" data-a="f" data-t="bool" data-i="' + i + '" data-k="madeToOrder"' + (p.madeToOrder ? " checked" : "") + "> Made to order</label>" +
      '<label><input type="checkbox" data-a="f" data-t="bool" data-i="' + i + '" data-k="hidden"' + (p.hidden ? " checked" : "") + "> Hide from website</label></div>" +
      '<p class="note">Website link ID: <code>' + esc(p.id) + "</code> (it does not change, so shared links keep working)</p>" +

      "<h3>Price and discount</h3><div class=\"grid\">" + fld(i, "price", "Original price (MRP)", p.price, { num: true }) +
      '<label class="f">Discount<select data-a="mode" data-i="' + i + '"><option value="none"' + (mode === "none" ? " selected" : "") + '>No discount</option><option value="pct"' + (mode === "pct" ? " selected" : "") + '>Percent off</option><option value="sale"' + (mode === "sale" ? " selected" : "") + ">Exact sale price</option></select></label>" +
      (mode === "pct" ? fld(i, "discount", "Percent off (e.g. 20)", p.discount, { num: true }) : "") + (mode === "sale" ? fld(i, "salePrice", "Sale price", p.salePrice, { num: true }) : "") + "</div>" +
      '<div class="prev" id="prev' + i + '">' + prevText(p) + "</div>" +

      "<h3>Photos</h3><p class=\"note\">The first photo is the cover on the shop page. Copy the photo files into the <code>images</code> folder.</p>" +
      ph.map(function (src, k) {
        return '<div class="ph"><img src="' + esc(src) + '" alt=""><input data-a="ph" data-i="' + i + '" data-k="' + k + '" value="' + esc(src) + '"><button class="btn sm" data-act="phu" data-i="' + i + '" data-k="' + k + '">&uarr;</button><button class="btn sm danger" data-act="phx" data-i="' + i + '" data-k="' + k + '">&times;</button></div>';
      }).join("") +
      '<label class="btn sm">+ Add photos<input type="file" accept="image/*" multiple hidden data-a="files" data-i="' + i + '"></label>' +

      "<h3>Colours and stock</h3><div class=\"scroll\"><table class=\"tbl\"><tr><th>Colour</th><th>Swatch</th><th>Its photo</th>" + sz.map(function (s) { return "<th>" + esc(s) + ' <a href="#" data-act="szx" data-i="' + i + '" data-s="' + esc(s) + '" title="Remove size" style="color:#b3261e;text-decoration:none">&times;</a></th>'; }).join("") + "<th></th></tr>" +
      p.colours.map(function (c, ci) {
        return "<tr><td><input type=\"text\" data-a=\"cf\" data-i=\"" + i + "\" data-c=\"" + ci + "\" data-k=\"name\" value=\"" + esc(c.name) + "\"></td>" +
          '<td><input type="color" data-a="cf" data-i="' + i + '" data-c="' + ci + '" data-k="hex" value="' + esc(/^#[0-9a-f]{6}$/i.test(c.hex) ? c.hex : "#cccccc") + '"></td>' +
          '<td><select data-a="cf" data-i="' + i + '" data-c="' + ci + '" data-k="image"><option value="">None</option>' + ph.map(function (s) { return '<option value="' + esc(s) + '"' + (c.image === s ? " selected" : "") + ">" + esc(s.replace("images/", "")) + "</option>"; }).join("") + "</select></td>" +
          sz.map(function (s) { var v = c.sizes[s] == null ? 0 : c.sizes[s]; return '<td><input type="number" min="0" data-a="st" data-i="' + i + '" data-c="' + ci + '" data-s="' + esc(s) + '" value="' + v + '"' + (v === 0 && !p.madeToOrder ? ' class="zero"' : "") + "></td>"; }).join("") +
          '<td><button class="btn sm danger" data-act="c0" data-i="' + i + '" data-c="' + ci + '">Sold out</button> <button class="btn sm" data-act="cx" data-i="' + i + '" data-c="' + ci + '">Remove</button></td></tr>';
      }).join("") + "</table></div>" +
      '<div class="acts" style="margin-top:8px"><button class="btn sm" data-act="addc" data-i="' + i + '">+ Add colour</button>' +
      '<select id="addsz' + i + '"><option value="">Add size...</option>' + STD.filter(function (s) { return sz.indexOf(s) < 0; }).map(function (s) { return "<option>" + s + "</option>"; }).join("") + '<option value="__c">Custom size...</option></select><button class="btn sm" data-act="adds" data-i="' + i + '">Add size</button></div>' +

      "<h3>Details shown on the product page</h3><div class=\"grid\">" + fld(i, "description", "Short description", p.description, { hint: "shown on the shop grid" }) + fld(i, "fabric", "Fabric", p.fabric) +
      fld(i, "gsm", "Fabric weight (GSM)", p.gsm || "", { num: true, hint: "usually 200 to 300" }) + fld(i, "fit", "Fit", p.fit) + fld(i, "includes", "What is included", p.includes) + fld(i, "care", "Care instructions", p.care) + "</div>" +
      '<div class="grid" style="margin-top:12px">' + fld(i, "longDescription", "Full description", p.longDescription.join("\n"), { area: true, hint: "one paragraph per line" }) +
      fld(i, "highlights", "Highlights", p.highlights.join("\n"), { area: true, hint: "one point per line" }) + "</div>" +
      '<div class="acts" style="margin-top:18px"><button class="btn sm" data-act="dup" data-i="' + i + '">Duplicate this product</button><button class="btn sm danger" data-act="del" data-i="' + i + '">Delete product</button></div></div>';
    return h;
  }
  function prevText(p) { var x = priceInfo(p); return x.off ? "Customers pay <b>" + fmt(x.pay) + "</b> instead of " + fmt(x.mrp) + " (<b>" + x.off + "% off</b>, saves " + fmt(x.mrp - x.pay) + ")" : "Customers pay <b>" + fmt(x.pay) + "</b> (no discount)"; }

  function storeView() {
    var s = S.store, f = function (k, l, hint, num) { return '<label class="f">' + l + (hint ? " <small>" + hint + "</small>" : "") + '<input data-a="sf" data-k="' + k + '" data-t="' + (num ? "num" : "str") + '" ' + (num ? 'type="number" min="0"' : 'type="text"') + ' value="' + esc(s[k]) + '"></label>'; };
    return '<div class="card"><div class="body"><h3>Store settings</h3><div class="grid">' + f("name", "Brand name") + f("whatsapp", "WhatsApp number", "country code + number, no + or spaces") + f("instagram", "Instagram link") + f("email", "Email") + f("currency", "Currency symbol") +
      f("sitewideDiscount", "Site-wide sale (% off everything)", "0 = no sale. Use for Eid or festival sales.", true) + f("lowStockAt", "Show \"Few left\" at or below", "total pieces", true) + "</div></div></div>" +
      '<div class="card"><div class="body"><h3>Categories</h3><p class="note">These appear in the menu and filter buttons. Do not remove a category that products still use.</p>' +
      S.cats.map(function (c, k) { return '<div class="ph"><input data-a="cat" data-k="' + k + '" data-f="name" value="' + esc(c.name) + '" placeholder="Name"><input data-a="cat" data-k="' + k + '" data-f="arabic" value="' + esc(c.arabic || "") + '" placeholder="Arabic"><span class="note" style="min-width:90px">id: ' + esc(c.id) + '</span><button class="btn sm danger" data-act="catx" data-k="' + k + '">&times;</button></div>'; }).join("") +
      '<button class="btn sm" data-act="addcat">+ Add category</button></div></div>';
  }

  function helpView() {
    return '<div class="help"><h2>How to update your website in 3 steps</h2><ol><li>Change what you need here (stock, price, photos, a new product).</li><li>Click <b>Download products.js</b> at the top.</li><li>Replace the file <code>data/products.js</code> in your website folder with the downloaded file and upload it. Refresh your site with Ctrl+F5.</li></ol>' +
      '<h2>Mark something out of stock</h2><ul><li><b>Whole product:</b> click <b>Mark out of stock</b> on its card. Customers see "Sold out" and can message you to ask when it is back.</li><li><b>One colour:</b> in <b>Quick stock</b>, click <b>Sold out</b> on that colour row (sets every size to 0).</li><li><b>One size:</b> type 0 in that box.</li></ul>' +
      '<h2>Remove a product</h2><ul><li><b>Temporarily:</b> click <b>Hide</b> (Products tab). It disappears from the website but you keep all its details.</li><li><b>For good:</b> open it with <b>Edit</b> and click <b>Delete product</b>.</li></ul>' +
      '<h2>Add a new product</h2><ol><li>Copy the photos into the <code>images</code> folder.</li><li>Products tab, <b>+ Add product</b>, fill in the form. Use <b>+ Add photos</b> and pick the same photo files.</li><li>Add colours and stock, then download and upload.</li></ol>' +
      '<h2>Good to know</h2><ul><li>Your work is saved as a draft in this browser while you edit. The website only changes after you upload the downloaded file.</li><li>Keep a copy of your old <code>products.js</code> as a backup.</li><li>Photos are not uploaded by this tool. Copy them into the images folder yourself.</li></ul></div>';
  }

  function render() {
    var tabs = [["stock", "Quick stock"], ["prods", "Products"], ["store", "Store and categories"], ["help", "Help"]];
    $("tabs").innerHTML = tabs.map(function (t) { return '<button data-tab="' + t[0] + '"' + (UI.tab === t[0] ? ' class="on"' : "") + ">" + t[1] + "</button>"; }).join("");
    var y = scrollY;
    $("view").innerHTML = UI.tab === "stock" ? stockView() : UI.tab === "prods" ? productsView() : UI.tab === "store" ? storeView() : helpView();
    banner(); scrollTo(0, y);
  }
  function refresh(i) {
    var p = S.prods[i], el = $("pill" + i); if (el) { var st = status(p); el.className = "pill " + st[0]; el.textContent = st[1]; }
    var pv = $("prev" + i); if (pv) pv.innerHTML = prevText(p);
  }

  /* ---------- events ---------- */
  document.addEventListener("input", function (e) {
    var t = e.target, a = t.dataset.a;
    if (t.id === "q") { UI.q = t.value; render(); $("q").focus(); $("q").setSelectionRange(UI.q.length, UI.q.length); return; }
    if (!a) return;
    var i = +t.dataset.i, p = S.prods[i];
    if (a === "f") {
      var k = t.dataset.k, ty = t.dataset.t, v;
      if (ty === "bool") v = t.checked; else if (ty === "num") v = t.value === "" ? 0 : Math.max(0, +t.value); else if (ty === "lines") v = t.value.split("\n").map(function (x) { return x.trim(); }).filter(Boolean); else v = t.value;
      if (ty === "num" && k === "gsm" && !v) { delete p.gsm; } else p[k] = v;
      if (k === "name" && ty === "str") { var nm = t.closest(".card").querySelector(".nm b"); if (nm) nm.textContent = v || "Untitled"; }
      if (ty === "bool") { save(); render(); return; }
    } else if (a === "st") { var c = p.colours[+t.dataset.c]; c.sizes[t.dataset.s] = Math.max(0, parseInt(t.value || "0", 10) || 0); t.classList.toggle("zero", c.sizes[t.dataset.s] === 0 && !p.madeToOrder); }
    else if (a === "cf") { var cc = p.colours[+t.dataset.c]; cc[t.dataset.k] = t.value; if (t.dataset.k === "image" && !t.value) delete cc.image; }
    else if (a === "ph") { var old = p.images[+t.dataset.k]; p.images[+t.dataset.k] = t.value.trim(); p.colours.forEach(function (c) { if (c.image === old) c.image = t.value.trim(); }); t.previousElementSibling.src = t.value; }
    else if (a === "sf") { S.store[t.dataset.k] = t.dataset.t === "num" ? Math.max(0, +t.value || 0) : t.value; }
    else if (a === "cat") { S.cats[+t.dataset.k][t.dataset.f] = t.value; }
    save(); if (p) refresh(i);
  });
  document.addEventListener("change", function (e) {
    var t = e.target, a = t.dataset.a;
    if (t.id === "flt") { UI.filter = t.value; render(); return; }
    if (a === "mode") {
      var p = S.prods[+t.dataset.i]; delete p.discount; delete p.salePrice;
      if (t.value === "pct") p.discount = 10; if (t.value === "sale") p.salePrice = Math.round(p.price * 0.9 / 10) * 10;
      save(); render(); return;
    }
    if (a === "files") {
      var p2 = S.prods[+t.dataset.i]; Array.prototype.forEach.call(t.files, function (f) { var n = "images/" + f.name; if (p2.images.indexOf(n) < 0) p2.images.push(n); });
      save(); render(); toast("Remember to copy these photos into your images folder"); return;
    }
    if (a === "cf" && t.dataset.k === "image") render();
  });
  document.addEventListener("click", function (e) {
    var tb = e.target.closest("[data-tab]"); if (tb) { UI.tab = tb.dataset.tab; render(); return; }
    var b = e.target.closest("[data-act]"); if (!b) return;
    e.preventDefault();
    var act = b.dataset.act, i = +b.dataset.i, p = S.prods[i], k = +b.dataset.k, c = +b.dataset.c;
    if (act === "download") return download();
    if (act === "discard") { if (confirm("Discard all unsaved changes and go back to the current website data?")) { try { localStorage.removeItem(KEY); } catch (x) {} usedDraft = false; dirty = false; S = (function () { return { store: clone(STORE), cats: clone(CATEGORIES), prods: PRODUCTS.map(normProduct) }; })(); render(); toast("Changes discarded"); } return; }
    if (act === "oos") { p.outOfStock = !p.outOfStock; toast(p.name + (p.outOfStock ? " is now out of stock" : " is back in stock")); }
    else if (act === "hide") p.hidden = !p.hidden;
    else if (act === "open") UI.open[p.id] = !UI.open[p.id];
    else if (act === "up" || act === "down") { var j = act === "up" ? i - 1 : i + 1; if (j < 0 || j >= S.prods.length) return; var tmp = S.prods[i]; S.prods[i] = S.prods[j]; S.prods[j] = tmp; }
    else if (act === "c0") { for (var s in p.colours[c].sizes) p.colours[c].sizes[s] = 0; }
    else if (act === "cx") { if (confirm("Remove this colour?")) p.colours.splice(c, 1); else return; }
    else if (act === "addc") { var sz = sizesOf(p), o = {}; (sz.length ? sz : ["S", "M", "L"]).forEach(function (s) { o[s] = 0; }); p.colours.push({ name: "New colour", hex: "#cccccc", sizes: o }); }
    else if (act === "adds") {
      var sel = $("addsz" + i), v = sel.value; if (!v) return; if (v === "__c") { v = (prompt("Size name (for example 52 or Free size)") || "").trim(); if (!v) return; }
      p.colours.forEach(function (cc) { if (cc.sizes[v] == null) cc.sizes[v] = 0; });
    }
    else if (act === "szx") { if (!confirm("Remove size " + b.dataset.s + " from every colour?")) return; p.colours.forEach(function (cc) { delete cc.sizes[b.dataset.s]; }); }
    else if (act === "phx") { var rm = p.images.splice(k, 1)[0]; p.colours.forEach(function (cc) { if (cc.image === rm) delete cc.image; }); }
    else if (act === "phu") { if (k < 1) return; var im = p.images; var t2 = im[k]; im[k] = im[k - 1]; im[k - 1] = t2; }
    else if (act === "del") { if (!confirm("Delete " + p.name + " permanently? Use Hide if you only want to remove it for now.")) return; S.prods.splice(i, 1); }
    else if (act === "dup") { var d = clone(p); d.name = p.name + " copy"; d.id = uniqueId(p.id + "-copy"); S.prods.splice(i + 1, 0, d); UI.open[d.id] = true; }
    else if (act === "addp") { var nm = prompt("Product name"); if (!nm) return; var np = normProduct({ id: uniqueId(slug(nm)), category: S.cats[0] ? S.cats[0].id : "", name: nm, arabic: "", description: "", price: 0, badge: "", images: [], crop: false, madeToOrder: false, outOfStock: false, hidden: false, longDescription: [], highlights: [], fabric: "", care: "", colours: [{ name: "Colour 1", hex: "#cccccc", sizes: { S: 0, M: 0, L: 0, XL: 0 } }] }); S.prods.unshift(np); UI.open[np.id] = true; UI.tab = "prods"; }
    else if (act === "addcat") { var cn = prompt("Category name"); if (!cn) return; var id = slug(cn); S.cats.push({ id: id, name: cn, arabic: "" }); }
    else if (act === "catx") { var used = S.prods.some(function (q) { return q.category === S.cats[k].id; }); if (used) { alert("Some products use this category. Move them to another category first."); return; } S.cats.splice(k, 1); }
    save(); render();
  });
  function uniqueId(base) { var id = base, n = 2; while (S.prods.some(function (p) { return p.id === id; })) id = base + "-" + n++; return id; }

  /* ---------- export ---------- */
  function clean(p) {
    var o = { id: p.id, category: p.category, name: p.name, arabic: p.arabic, description: p.description, price: +p.price || 0 };
    if (p.discount > 0) o.discount = +p.discount; else if (p.salePrice) o.salePrice = +p.salePrice;
    o.badge = p.badge || ""; o.images = p.images; o.crop = !!p.crop; o.madeToOrder = !!p.madeToOrder; o.outOfStock = !!p.outOfStock; o.hidden = !!p.hidden;
    o.longDescription = p.longDescription; o.highlights = p.highlights; o.fabric = p.fabric;
    if (p.gsm) o.gsm = +p.gsm; o.fit = p.fit || ""; o.includes = p.includes || ""; o.care = p.care;
    var sz = sizesOf(p);
    o.colours = p.colours.map(function (c) { var q = { name: c.name, hex: c.hex }; if (c.image) q.image = c.image; q.sizes = {}; sz.forEach(function (s) { q.sizes[s] = Math.max(0, +c.sizes[s] || 0); }); return q; });
    return o;
  }
  function download() {
    var bad = [], ids = {};
    S.prods.forEach(function (p) {
      if (ids[p.id]) bad.push("Duplicate product ID: " + p.id); ids[p.id] = 1;
      if (!p.name) bad.push("A product has no name."); if (!(+p.price > 0)) bad.push((p.name || p.id) + " has no price.");
      if (!p.images.length) bad.push((p.name || p.id) + " has no photos."); if (!p.colours.length) bad.push((p.name || p.id) + " has no colours.");
      if (!p.category || !S.cats.some(function (c) { return c.id === p.category; })) bad.push((p.name || p.id) + " has no valid category.");
    });
    if (bad.length) { alert("Please fix these first:\n\n" + bad.slice(0, 12).join("\n")); return; }
    var txt = "/* House of Al Mahrah: store settings and products.\n   Generated by admin.html (Shop Manager) on " + new Date().toLocaleString() + ".\n   Easiest way to edit: open admin.html in your browser. See HOW-TO-ADD-PRODUCTS.txt. */\n\n" +
      "const STORE = " + JSON.stringify(S.store, null, 2) + ";\n\nconst CATEGORIES = " + JSON.stringify(S.cats, null, 2) + ";\n\nconst PRODUCTS = " + JSON.stringify(S.prods.map(clean), null, 2) + ";\n";
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/javascript;charset=utf-8" })); a.download = "products.js"; document.body.appendChild(a); a.click(); a.remove();
    toast("Downloaded. Now replace data/products.js with this file.");
  }

  addEventListener("beforeunload", function (e) { if (dirty && !usedDraft) { /* draft is saved; no prompt */ } });
  init(); render();
})();
</script>
</body>
</html>
